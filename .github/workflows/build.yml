name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Android platform
        run: |
          npx cap add android || true
          test -d android

      # V0.7.25: the GitHub build skipped these three steps (only GitLab ran them), so it had no permissions, no native plugins and versionCode = run number.
      - name: Permissions in the manifest
        run: bash tools/ci-patch-manifest.sh android/app/src/main/AndroidManifest.xml

      - name: Native plugins (folder sync, device, secure storage)
        run: bash tools/ci-add-native.sh android

      - name: Install Limitless launcher icon (fails the build if missing)
        run: bash tools/ci-add-icons.sh android

      - name: Version name and a versionCode that always counts up
        run: bash tools/ci-set-version.sh android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install SDK packages
        run: |
          SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"; yes | "$SM" --licenses || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Release signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "ERROR: add the repository secrets KEYSTORE_BASE64 (base64 -w0 of your .jks) and KEYSTORE_PASSWORD (KEY_ALIAS and KEY_PASSWORD are optional)."
            exit 1
          fi
          G=android/app/build.gradle
          KF="${RUNNER_TEMP:-/tmp}/ln-release.jks"
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$KF"
          [ -s "$KF" ] || { echo "ERROR: KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }
          export KS_PASS
          LIST="$(keytool -list -keystore "$KF" -storepass:env KS_PASS 2>&1)" || { echo "ERROR: could not open the keystore. Check KEYSTORE_PASSWORD."; exit 1; }
          ALIASES="$(printf '%s\n' "$LIST" | awk -F', ' '/PrivateKeyEntry/ {print $1}')"
          if [ -n "$KS_ALIAS" ]; then
            A="$(printf '%s\n' "$ALIASES" | grep -ixF -- "$KS_ALIAS" | head -n 1 || true)"
            [ -n "$A" ] || { echo "ERROR: KEY_ALIAS does not match. Keys in the keystore:"; printf '%s\n' "$ALIASES" | sed 's/^/  - /'; exit 1; }
          else
            [ "$(printf '%s\n' "$ALIASES" | grep -c .)" -eq 1 ] || { echo "ERROR: KEY_ALIAS not set and the keystore has several keys:"; printf '%s\n' "$ALIASES" | sed 's/^/  - /'; exit 1; }
            A="$ALIASES"
          fi
          {
            echo "LN_KS_FILE=$KF"
            echo "LN_KS_PASS=$KS_PASS"
            echo "LN_KS_ALIAS=$A"
            echo "LN_KS_KEYPASS=${KS_KEYPASS:-$KS_PASS}"
          } >> "$GITHUB_ENV"
          if ! grep -q "LN_KS_FILE" "$G"; then
            cat >> "$G" <<'GRADLE'

          // Limitless CI (V0.7.25): sign the RELEASE build with the persistent key
          android {
              signingConfigs {
                  lnRelease {
                      storeFile file(System.getenv("LN_KS_FILE"))
                      storePassword System.getenv("LN_KS_PASS")
                      keyAlias System.getenv("LN_KS_ALIAS")
                      keyPassword System.getenv("LN_KS_KEYPASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lnRelease
                      debuggable false
                  }
              }
          }
          GRADLE
          fi
          grep -q "LN_KS_FILE" "$G" && echo "release signing config added (alias $A)" || { echo "ERROR: could not add the signing config"; exit 1; }

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify it is a signed Release, not Debug
        run: bash tools/verify-release.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK with its version
        id: apk
        run: |
          V=$(node -p "require('./package.json').version")
          OUT="android/app/build/outputs/apk/release/limitless-notepad-V${V}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=limitless-notepad-V${V}-release" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release (for Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="V${{ steps.apk.outputs.version }}-b${{ github.run_number }}"
          cp "${{ steps.apk.outputs.path }}" "${{ github.event.repository.name }}.apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${{ github.event.repository.name }}.apk" \
            --title "$TAG" --notes "Signed release build ${{ github.sha }}"
