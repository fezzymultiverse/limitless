name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Add Android Platform
        run: npx cap add android
      - name: Copy Custom Icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable
          
          # Copy from the root where Claude generated them
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp ln_icon_round.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          cp ln_icon_fg.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png || true
          cp splash.png android/app/src/main/res/drawable/splash.png || true
          
          # Copy the adaptive icon XML if it exists
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp ln_icon.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          cp ln_icon_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true

      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
